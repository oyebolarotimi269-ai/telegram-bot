name: Sync upstream main into audit-report branch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream-audit
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge upstream and push
        env:
          BRANCH: devx/operator-audit-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mimir-stellar/telegram-bot.git
          git fetch upstream main
          git fetch origin "$BRANCH"
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BASE=$(git merge-base "origin/$BRANCH" upstream/main)
          if [ "$BASE" = "$UPSTREAM_HEAD" ]; then
            echo "Already synced with $UPSTREAM_HEAD - nothing to do"
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git merge --no-edit upstream/main
          npm ci
          npm run typecheck
          npm run lockfile:check
          npm test
          git push origin "$BRANCH" --force-with-lease
          echo "Merged upstream $UPSTREAM_HEAD into $BRANCH and pushed"
